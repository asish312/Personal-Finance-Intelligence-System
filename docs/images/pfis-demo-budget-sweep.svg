<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">PFIS demo budget allocation and verified savings sweep</title>
<desc id="desc">Illustrative zero-based monthly budget with synthetic INR amounts and a planned versus verified savings sweep. All values are fictional.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10192d"/><stop offset="1" stop-color="#1c3150"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#13b8a6"/><stop offset="1" stop-color="#43d6be"/></linearGradient>
 <style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.white{fill:#f7fbff}.muted{fill:#9eb0cb}.card{fill:#172741;stroke:#2c4565;stroke-width:1}.tiny{font-size:13px}.small{font-size:15px}.head{font-size:22px;font-weight:750}.amount{font-size:28px;font-weight:800}.line{stroke:#37516f;stroke-width:1}</style>
</defs>
<rect width="1440" height="820" rx="28" fill="url(#bg)"/>
<rect x="32" y="28" width="1376" height="108" rx="20" fill="url(#teal)"/>
<g class="ui white"><text x="68" y="74" font-size="28" font-weight="800">ZERO-BASED BUDGET</text><text x="68" y="103" font-size="15" opacity=".9">Give every rupee a job · Example budget period: NOV-2026</text><text x="1360" y="76" text-anchor="end" font-size="15" font-weight="750">SYNTHETIC DEMO</text><text x="1360" y="103" text-anchor="end" font-size="13">Not connected to a real account</text></g>
<rect class="card" x="32" y="164" width="420" height="188" rx="18"/>
<text class="ui muted small" x="62" y="205">INCOME ALLOCATED</text><text class="ui white amount" x="62" y="253">₹1,20,000</text><text class="ui muted small" x="62" y="284">Opening budget allocation</text><rect x="62" y="305" width="350" height="12" rx="6" fill="#2b4360"/><rect x="62" y="305" width="6" height="12" rx="6" fill="#37cbb6"/><text class="ui tiny" x="62" y="337" fill="#55dbc9">Starts from ₹0 · allocated income funds the month</text>
<rect class="card" x="474" y="164" width="934" height="188" rx="18"/>
<text class="ui white head" x="506" y="207">Allocate before you spend</text>
<g class="ui small muted"><text x="506" y="249">Essential commitments</text><text x="506" y="289">Operating spend</text><text x="506" y="329">Debt / EMI settlements</text><text x="936" y="249">Investment allocation</text><text x="936" y="289">Pre-sweep surplus</text></g>
<g class="ui white" font-size="17" font-weight="700"><text x="820" y="249" text-anchor="end">₹42,000</text><text x="820" y="289" text-anchor="end">₹26,500</text><text x="820" y="329" text-anchor="end">₹16,500</text><text x="1268" y="249" text-anchor="end">₹10,000</text><text x="1268" y="289" text-anchor="end" fill="#4fdbc7">₹25,000</text></g>
<rect x="506" y="310" width="380" height="12" rx="6" fill="#2b4360"/><rect x="506" y="310" width="133" height="12" rx="6" fill="#4c8dff"/><rect x="639" y="310" width="84" height="12" fill="#a78bfa"/><rect x="723" y="310" width="53" height="12" fill="#f6b454"/><rect x="776" y="310" width="32" height="12" rx="5" fill="#39c6b4"/>
<rect class="card" x="32" y="380" width="660" height="350" rx="20"/>
<text class="ui white head" x="66" y="425">Savings sweep tracker</text><text class="ui muted small" x="66" y="451">The planned sweep is not counted as savings until both transfer legs match.</text>
<g class="ui small muted"><text x="66" y="505">Planned sweep</text><text x="66" y="563">Verified source debit</text><text x="66" y="621">Verified savings credit</text><text x="66" y="679">Actual verified savings</text></g>
<g class="ui white" font-size="22" font-weight="750"><text x="620" y="505" text-anchor="end">₹25,000</text><text x="620" y="563" text-anchor="end">₹22,000</text><text x="620" y="621" text-anchor="end">₹22,000</text><text x="620" y="679" text-anchor="end" fill="#45d6bd">₹22,000</text></g>
<path d="M66 523H620M66 581H620M66 639H620" stroke="#2d4563" stroke-width="1"/>
<rect x="66" y="696" width="554" height="10" rx="5" fill="#2b4360"/><rect x="66" y="696" width="487" height="10" rx="5" fill="#36c8b6"/>
<rect class="card" x="714" y="380" width="694" height="350" rx="20"/>
<text class="ui white head" x="748" y="425">Transfer reconciliation</text><text class="ui muted small" x="748" y="451">Two bank movements · one verified internal transfer</text>
<rect x="748" y="478" width="270" height="104" rx="14" fill="#203d59" stroke="#3b6883"/><rect x="1100" y="478" width="270" height="104" rx="14" fill="#1d493f" stroke="#318e76"/>
<g class="ui"><text x="772" y="509" fill="#8db9da" font-size="13" font-weight="700">SOURCE ACCOUNT</text><text x="772" y="542" fill="#fff" font-size="20" font-weight="750">−₹22,000</text><text x="772" y="565" fill="#a4b9ce" font-size="13">Verified debit · DEMO-TX-101</text><text x="1124" y="509" fill="#74dec4" font-size="13" font-weight="700">SAVINGS ACCOUNT</text><text x="1124" y="542" fill="#fff" font-size="20" font-weight="750">+₹22,000</text><text x="1124" y="565" fill="#a4cbbf" font-size="13">Verified credit · DEMO-TX-102</text></g>
<path d="M1030 528H1084m-10-8 10 8-10 8" stroke="#4bd2bb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="748" y="608" width="622" height="82" rx="14" fill="#123e39" stroke="#258a73"/>
<circle cx="782" cy="649" r="13" fill="#38c99f"/><path d="m776 649 4 4 8-9" stroke="#083b30" stroke-width="3" fill="none" stroke-linecap="round"/>
<g class="ui"><text x="810" y="642" fill="#76e4c6" font-size="14" font-weight="750">MATCHED &amp; COMPLETED</text><text x="810" y="665" fill="#c2e9df" font-size="13">Both legs reconcile · ₹3,000 remains unallocated</text></g>
<text class="ui tiny" x="1360" y="776" text-anchor="end" fill="#f8c56a" font-weight="700">ALL AMOUNTS AND TRANSACTION IDS ARE FICTIONAL DEMO DATA</text>
</svg>