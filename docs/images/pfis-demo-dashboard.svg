<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">PFIS demo analytics dashboard</title>
<desc id="desc">Illustrative personal finance dashboard with synthetic INR figures, monthly budget, spending, savings sweep, cash-flow trend, category mix and sample transactions. No live account data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#17264a"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#15b8a6"/><stop offset="1" stop-color="#3976f6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020817" flood-opacity=".22"/></filter>
  <style>
    .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa9c6}.white{fill:#f7f9ff}.tiny{font-size:13px}.small{font-size:15px}.label{font-size:14px;font-weight:600;letter-spacing:.3px}.value{font-size:30px;font-weight:750}.card{fill:#17233d;stroke:#2b3b5c;stroke-width:1}.panel{fill:#111d34;stroke:#263956;stroke-width:1}.gridline{stroke:#354563;stroke-width:1;opacity:.65}
  </style>
</defs>
<rect width="1440" height="900" rx="30" fill="url(#bg)"/>
<rect x="34" y="30" width="1372" height="116" rx="22" fill="url(#hero)" opacity=".98"/>
<circle cx="93" cy="87" r="27" fill="#ffffff" opacity=".18"/><path d="M80 91c8-19 17-19 26 0M81 99h25" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<g class="ui white"><text x="138" y="81" font-size="30" font-weight="800">PFIS</text><text x="138" y="108" font-size="15" opacity=".88">PERSONAL FINANCE INTELLIGENCE SYSTEM</text><text x="1358" y="75" text-anchor="end" font-size="14" font-weight="700">DEMO WORKSPACE</text><text x="1358" y="104" text-anchor="end" font-size="13" opacity=".86">Illustrative data · INR · Not live account figures</text></g>
<g class="ui">
  <g filter="url(#shadow)">
    <rect class="card" x="34" y="174" width="328" height="142" rx="18"/><rect class="card" x="382" y="174" width="328" height="142" rx="18"/><rect class="card" x="730" y="174" width="328" height="142" rx="18"/><rect class="card" x="1078" y="174" width="328" height="142" rx="18"/>
  </g>
  <g class="muted label"><text x="62" y="212">BUDGET INCOME</text><text x="410" y="212">SPENDING TRACKED</text><text x="758" y="212">PLANNED SAVINGS SWEEP</text><text x="1106" y="212">VERIFIED SAVINGS</text></g>
  <g class="white value"><text x="62" y="260">₹1,20,000</text><text x="410" y="260">₹68,500</text><text x="758" y="260">₹25,000</text><text x="1106" y="260">₹22,000</text></g>
  <g font-size="13" class="ui"><text x="62" y="291" fill="#4bd7c5">+ Monthly allocation</text><text x="410" y="291" fill="#f6b95b">57% of allocated income</text><text x="758" y="291" fill="#7da8ff">Awaiting final transfer match</text><text x="1106" y="291" fill="#4bd7c5">Matched debit + credit</text></g>
  <rect class="panel" x="34" y="344" width="850" height="330" rx="20"/>
  <text x="66" y="386" class="white" font-size="20" font-weight="750">Monthly cash-flow snapshot</text><text x="66" y="410" class="muted small">Synthetic illustration · last six budget periods</text>
  <g class="gridline"><path d="M92 466H830M92 520H830M92 574H830M92 628H830"/></g>
  <g class="ui muted tiny"><text x="66" y="471">₹140k</text><text x="66" y="525">₹100k</text><text x="76" y="579">₹60k</text><text x="76" y="633">₹20k</text></g>
  <path d="M112 503 L244 488 L376 465 L508 481 L640 452 L772 438" fill="none" stroke="#39c6b4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 580 L244 564 L376 571 L508 546 L640 558 L772 539" fill="none" stroke="#ffb454" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 503 L244 488 L376 465 L508 481 L640 452 L772 438 L772 628 L112 628Z" fill="#2bc6b3" opacity=".08"/>
  <g fill="#39c6b4"><circle cx="112" cy="503" r="6"/><circle cx="244" cy="488" r="6"/><circle cx="376" cy="465" r="6"/><circle cx="508" cy="481" r="6"/><circle cx="640" cy="452" r="6"/><circle cx="772" cy="438" r="6"/></g>
  <g fill="#ffb454"><circle cx="112" cy="580" r="6"/><circle cx="244" cy="564" r="6"/><circle cx="376" cy="571" r="6"/><circle cx="508" cy="546" r="6"/><circle cx="640" cy="558" r="6"/><circle cx="772" cy="539" r="6"/></g>
  <g class="ui muted small" text-anchor="middle"><text x="112" y="652">May</text><text x="244" y="652">Jun</text><text x="376" y="652">Jul</text><text x="508" y="652">Aug</text><text x="640" y="652">Sep</text><text x="772" y="652">Oct</text></g>
  <g class="ui small"><circle cx="650" cy="390" r="5" fill="#39c6b4"/><text x="663" y="395" class="muted">Income</text><circle cx="748" cy="390" r="5" fill="#ffb454"/><text x="761" y="395" class="muted">Outflow</text></g>
  <rect class="panel" x="904" y="344" width="502" height="330" rx="20"/>
  <text x="936" y="386" class="white" font-size="20" font-weight="750">Spending composition</text><text x="936" y="410" class="muted small">Sample category mix · ₹68,500 total</text>
  <circle cx="1060" cy="535" r="92" fill="none" stroke="#263853" stroke-width="27"/>
  <circle cx="1060" cy="535" r="92" fill="none" stroke="#35c6b3" stroke-width="27" stroke-dasharray="202 578" stroke-dashoffset="0" transform="rotate(-90 1060 535)"/>
  <circle cx="1060" cy="535" r="92" fill="none" stroke="#5989ff" stroke-width="27" stroke-dasharray="151 578" stroke-dashoffset="-202" transform="rotate(-90 1060 535)"/>
  <circle cx="1060" cy="535" r="92" fill="none" stroke="#a78bfa" stroke-width="27" stroke-dasharray="82 578" stroke-dashoffset="-353" transform="rotate(-90 1060 535)"/>
  <circle cx="1060" cy="535" r="92" fill="none" stroke="#ffb454" stroke-width="27" stroke-dasharray="43 578" stroke-dashoffset="-435" transform="rotate(-90 1060 535)"/>
  <circle cx="1060" cy="535" r="92" fill="none" stroke="#f472b6" stroke-width="27" stroke-dasharray="100 578" stroke-dashoffset="-478" transform="rotate(-90 1060 535)"/>
  <g class="ui white" text-anchor="middle"><text x="1060" y="530" font-size="24" font-weight="800">₹68.5k</text><text x="1060" y="554" class="muted tiny">DEMO SPEND</text></g>
  <g class="ui small"><circle cx="1196" cy="469" r="5" fill="#35c6b3"/><text x="1210" y="474" class="muted">Housing · ₹24k</text><circle cx="1196" cy="505" r="5" fill="#5989ff"/><text x="1210" y="510" class="muted">Food · ₹18k</text><circle cx="1196" cy="541" r="5" fill="#a78bfa"/><text x="1210" y="546" class="muted">Transport · ₹8k</text><circle cx="1196" cy="577" r="5" fill="#ffb454"/><text x="1210" y="582" class="muted">Bills · ₹3.5k</text><circle cx="1196" cy="613" r="5" fill="#f472b6"/><text x="1210" y="618" class="muted">Other · ₹15k</text></g>
  <rect class="panel" x="34" y="700" width="1372" height="166" rx="20"/>
  <text x="66" y="742" class="white" font-size="20" font-weight="750">Recent activity · illustrative records</text>
  <g class="ui muted tiny"><text x="66" y="774">DEMO ID</text><text x="300" y="774">DATE</text><text x="490" y="774">DESCRIPTION</text><text x="940" y="774">CATEGORY</text><text x="1180" y="774">AMOUNT</text></g>
  <g class="ui small white"><text x="66" y="808">DEMO-001</text><text x="300" y="808">14 Oct 2026</text><text x="490" y="808">Harbor Coffee</text><text x="940" y="808" fill="#7dd3fc">Food &amp; Dining</text><text x="1180" y="808">−₹845.50</text><text x="66" y="840">DEMO-002</text><text x="300" y="840">13 Oct 2026</text><text x="490" y="840">Metro Transit</text><text x="940" y="840" fill="#c4b5fd">Transport</text><text x="1180" y="840">−₹320.00</text></g>
  <g class="ui tiny"><text x="1358" y="852" text-anchor="end" fill="#fbbf24" font-weight="700">ALL FIGURES ARE FICTIONAL DEMO DATA</text></g>
</g>
</svg>