<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">PFIS spending patterns — synthetic demo</title>
<desc id="desc">Sample spending analytics showing category composition, merchant concentration, weekday heatmap and recurring commitment trends.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c162a"/><stop offset="1" stop-color="#1d304e"/></linearGradient>
<style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.w{fill:#f6f8ff}.m{fill:#9aadc8}.card{fill:#14243d;stroke:#2f4565;stroke-width:1.4}.h{font-size:22px;font-weight:750}.sub{font-size:14px}.sm{font-size:15px}.tiny{font-size:12px}.grid{stroke:#354a67;stroke-width:1;opacity:.7}</style></defs>
<rect width="1600" height="1080" rx="30" fill="url(#bg)"/>
<rect x="34" y="28" width="1532" height="112" rx="22" fill="#253a5d"/>
